<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <title>Tikitaka · 대화 시작</title>
  <link rel="stylesheet" href="/assets/simple.css">
  <script type="module" src="/assets/simple.mjs?v=20261002-endpoint2"></script>
</head>
<body>
  <header><div class="brand"><span class="brandmark">t</span>tikitaka<span class="brand-dot">.</span></div></header>
  <main>
    <div class="intro"><h1>말하고 싶을 때,<br>그냥 시작하세요.</h1><p>두 AI 친구와, 편하게 나누는 대화.</p></div>
    <div class="friends" aria-label="함께 대화하는 AI 친구 두 명">
      <div class="friend" id="friend-a"><div class="face minji" aria-hidden="true"><i></i><i></i><span></span></div><p>민지 <small>AI</small></p></div>
      <div class="between" aria-hidden="true">···</div>
      <div class="friend" id="friend-b"><div class="face junho" aria-hidden="true"><i></i><i></i><span></span></div><p>준호 <small>AI</small></p></div>
    </div>
    <div class="caption" aria-live="polite"><span id="speaker"></span><p id="caption">친구들이 먼저 이야기할게요.<br>할 말이 생기면 언제든 끼어들어요.</p></div>
    <p id="error" class="error" role="alert" hidden></p>
    <button id="talk" disabled>대화 시작</button>
    <p id="status" class="status" role="status">준비 중…</p>
    <meter id="level" min="0" max="1" value="0" aria-label="마이크 입력 크기"></meter>
  </main>
  <footer><span id="build">개발용 · 대본 데모</span></footer>
</body>
</html>
