<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tikitaka · 개발용 마이크 점검</title><link rel="stylesheet" href="/assets/simple.css"><script type="module" src="/assets/mic.mjs"></script>
<style>select{width:100%;font:inherit;padding:14px;border:1px solid #cad3c5;border-radius:12px;margin:12px 0 24px;background:white}.check-meter{width:100%;height:16px;margin:24px 0}.back{display:inline-block;margin:24px;color:#284b3d}.note{font-size:13px;color:#71817a;line-height:1.7}.mic-info{min-height:75px;overflow-wrap:anywhere;white-space:pre-line}</style>
</head><body><header><div class="brand">tikitaka.</div></header><main>
<div class="intro"><h1>마이크 입력 점검</h1><p>개발용 화면 · AI 음성 없이 확인합니다.</p></div>
<p class="note">아래 버튼을 누르고 평소 목소리로 말해주세요.<br>입력이 없으면 목록에서 사용하는 마이크를 선택하세요.</p>
<label for="device">확인할 마이크</label><select id="device"><option value="">Chrome 기본 마이크</option></select>
<button id="check">마이크 확인 시작</button><meter class="check-meter" id="level" min="0" max="1" value="0" aria-label="실제 마이크 입력 크기"></meter>
<p id="result" class="status" role="status">점검 준비</p><p id="source" class="note mic-info"></p>
<p class="note">음성은 녹음하지 않습니다. 기기 상태와 입력 크기만 로컬 개발 서버에 저장합니다.<br>여기서 선택한 마이크는 이 브라우저의 대화 화면에도 적용되고, 포트가 바뀌어도 유지됩니다.</p>
<a class="back" href="/">대화 화면으로 돌아가기 →</a>
</main></body></html>
